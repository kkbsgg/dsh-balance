name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing: no stored npm token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do NOT set registry-url for OIDC-only publishing: setup-node then
          # writes a placeholder NODE_AUTH_TOKEN that shadows the OIDC exchange
          # and surfaces as "404 Not Found - PUT" (npm/cli#8730, #8976).

      - name: Install dependencies
        run: npm ci

      # OIDC trusted publishing requires npm >= 11.5.1; the node 22 runner
      # bundles npm 10.x, which fails with ENEEDAUTH (no OIDC exchange).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Debug OIDC environment
        run: |
          node -v
          npm -v
          echo "ID_TOKEN_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ID_TOKEN_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          node -e "const fs=require('fs');const p=process.env.HOME+'/.npmrc';console.log('npmrc:',fs.existsSync(p)?fs.readFileSync(p,'utf8').replace(/(_authToken=).*/g,'$1<redacted>'):'none')"

      - name: Publish to npm
        run: npm publish --provenance --access public
