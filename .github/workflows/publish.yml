name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing: no stored npm token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do NOT set registry-url for OIDC-only publishing: setup-node then
          # writes a placeholder NODE_AUTH_TOKEN that shadows the OIDC exchange
          # and surfaces as "404 Not Found - PUT" (npm/cli#8730, #8976).

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
