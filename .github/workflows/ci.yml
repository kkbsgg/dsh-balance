name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install peer dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Syntax-check host half
        run: |
          node --check lib/index.js

      - name: Syntax-check client half
        run: |
          node --check client/client.js

      - name: Host module exports
        run: |
          node --input-type=module -e "import('./lib/index.js').then((m) => { if (typeof m.apply !== 'function' || !Array.isArray(m.inject) || m.name !== '@kkbsgg/dsh-balance') process.exit(1); console.log('host module exports OK') })"

      - name: Client bundle id matches package name
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('client/client.js','utf8'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); if (!s.includes('id: \"'+pkg.name+'\"')) process.exit(1); console.log('client bundle id OK')"

      - name: Smoke test host half
        run: |
          node test/smoke.test.mjs
